name: Build Comfy Studio

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Criar pasta data no ComfyData
        run: New-Item -ItemType Directory -Force -Path "ComfyData\data"

      - name: 1. Compilar e Executar ComfyData
        run: |
          $solDir = (Get-Location).Path + "\"
          $proj = Get-ChildItem -Path "ComfyData" -Recurse -Filter "*.vcxproj" | Select-Object -First 1
          msbuild $proj.FullName /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$solDir"
          Get-Content "ComfyData\src\ComfyDataBuild.cpp" | Select-Object -First 60
          $exe = Get-ChildItem -Path "ComfyData" -Recurse -Filter "*.exe" | Select-Object -First 1
          if ($exe) {
            Push-Location $exe.DirectoryName
            & $exe.FullName
            Pop-Location
          }

      - name: 2. Compilar ComfyVersion
        run: |
          $solDir = (Get-Location).Path + "\"
          $proj = Get-ChildItem -Path "ComfyVersion" -Recurse -Filter "*.vcxproj" | Select-Object -First 1
          msbuild $proj.FullName /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$solDir"

      - name: 3. Compilar ComfyStudio
        run: |
          $solDir = (Get-Location).Path + "\"
          $proj = Get-ChildItem -Path "ComfyStudio" -Recurse -Filter "*.vcxproj" | Select-Object -First 1
          msbuild $proj.FullName /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$solDir"

      - name: 4. Procurar arquivos exigidos para Linked Stars
        run: |
          Get-ChildItem -Path "ComfyStudio\src" -Recurse -Include *.cpp,*.h | Select-String -Pattern "Linked|Star|f2|dev_rom" | Select-Object -First 80

      - name: Salvar executável e arquivos gerados
        uses: actions/upload-artifact@v4
        with:
          name: ComfyStudio-Build
          path: |
            **/bin/x64-Release/*.exe
            **/bin/x64-Release/*.dll
            ComfyData/data/*
