name: Build Comfy Studio

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Corrigir build.bat ausente
        run: |
          New-Item -ItemType Directory -Force -Path "ComfyVersion\build"
          Set-Content -Path "ComfyVersion\build\build.bat" -Value "@echo off"

      - name: Compilar Projeto
        run: msbuild Comfy.sln /p:Configuration=Release /p:Platform=x64

      - name: Salvar executável gerado
        uses: actions/upload-artifact@v4
        with:
          name: ComfyStudio-Build
          path: |
            **/bin/x64-Release/*.exe
            **/bin/x64-Release/*.dll
