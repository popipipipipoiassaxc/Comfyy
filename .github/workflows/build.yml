name: Build Comfy Studio

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Criar pasta data no ComfyData
        run: New-Item -ItemType Directory -Force -Path "ComfyData\data"

      - name: 1. Compilar ComfyData
        run: msbuild ComfyData\ComfyData.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: 2. Compilar ComfyVersion
        run: msbuild ComfyVersion\ComfyVersion.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: 3. Compilar ComfyStudio
        run: msbuild ComfyStudio\ComfyStudio.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Salvar executável e arquivos gerados
        uses: actions/upload-artifact@v4
        with:
          name: ComfyStudio-Build
          path: |
            ComfyStudio/bin/x64-Release/*.exe
            ComfyStudio/bin/x64-Release/*.dll
            ComfyData/data/*
