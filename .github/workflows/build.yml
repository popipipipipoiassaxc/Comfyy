name: Build Comfy Studio

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: 1. Compilar e Empacotar ComfyData
        run: |
          $solDir = (Get-Location).Path + "\"
          $proj = Get-ChildItem -Path "ComfyData" -Recurse -Filter "*.vcxproj" | Select-Object -First 1
          msbuild $proj.FullName /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$solDir"
          $exe = Get-ChildItem -Path "ComfyData" -Recurse -Filter "*.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path "ComfyData\data"
          Get-ChildItem -Path "ComfyData\data-src-sprset" -Directory | ForEach-Object {
            & $exe.FullName -build_sprset $_.FullName "ComfyData\data-src"
          }
          & $exe.FullName -build_comfy_data "ComfyData\data-src" "ComfyData\data\comfy_data.bin"
          Get-ChildItem -Path "ComfyData\data"

      - name: 2. Compilar ComfyVersion
        run: |
          $solDir = (Get-Location).Path + "\"
          $proj = Get-ChildItem -Path "ComfyVersion" -Recurse -Filter "*.vcxproj" | Select-Object -First 1
          msbuild $proj.FullName /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$solDir"

      - name: 3. Compilar ComfyStudio
        run: |
          $solDir = (Get-Location).Path + "\"
          $proj = Get-ChildItem -Path "ComfyStudio" -Recurse -Filter "*.vcxproj" | Select-Object -First 1
          msbuild $proj.FullName /p:Configuration=Release /p:Platform=x64 /p:SolutionDir="$solDir"

      - name: 4. Listar arquivos de estrela exigidos no dev_rom
        run: |
          Get-ChildItem -Path "ComfyStudio\src" -Recurse -Include *.cpp,*.h | Select-String -Pattern "aet_gam|spr_gam|LinkedStar|StarLink|f2_" | Select-Object -First 80

      - name: Salvar executável e arquivos gerados
        uses: actions/upload-artifact@v4
        with:
          name: ComfyStudio-Build
          path: |
            ComfyStudio/bin/x64-Release/*.exe
            ComfyStudio/bin/x64-Release/*.dll
            ComfyData/data/*
